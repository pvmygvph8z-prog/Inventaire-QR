<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventaire QR Noël</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      margin: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    .principal { background: #1976d2; color: white; }
    .plus { background: #2e7d32; color: white; }
    .moins { background: #c62828; color: white; }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    #resultat {
      display: none;
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
    }

    #message {
      margin: 15px;
      font-size: 17px;
    }

    .stock {
      font-size: 30px;
      font-weight: bold;
      margin: 15px;
    }

    .id {
      color: #666;
      font-size: 15px;
    }

    .saisie {
      margin: 20px 0;
    }

    .saisie label {
      display: block;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .saisie input {
      width: 120px;
      padding: 12px;
      font-size: 24px;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 10px;
    }

    .enregistrer {
      background: #1976d2;
      color: white;
    }
  </style>
</head>

<body>

<h1>\uD83C\uDF84 Inventaire QR Noël</h1>

<button class="principal" onclick="demarrerScanner()">
  \uD83D\uDCF7 Scanner un QR
</button>

<div id="message">
  Appuyez sur « Scanner un QR » pour commencer.
</div>

<div id="reader"></div>

<div id="resultat">

  <h2 id="nomProduit">Produit</h2>

  <div class="id" id="idProduit"></div>

  <div class="stock">
    Stock compté : <span id="stock">—</span>
  </div>

  <div class="saisie">

    <label for="stockSaisi">
      Saisir directement le stock :
    </label>

    <input
      type="number"
      id="stockSaisi"
      min="0"
      step="1"
      inputmode="numeric"
      placeholder="0"
    >

    <br>

    <button
      class="enregistrer"
      onclick="enregistrerStock()">
      ✓ Enregistrer
    </button>

  </div>

  <button class="moins" onclick="modifier(-1)">−1</button>
  <button class="plus" onclick="modifier(1)">+1</button>

  <br>

  <button class="moins" onclick="modifier(-10)">−10</button>
  <button class="plus" onclick="modifier(10)">+10</button>

  <br>

  <button class="principal" onclick="demarrerScanner()">
    \uD83D\uDCF7 Scanner le suivant
  </button>

</div>


<script>

const APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbxF74HSYXRjBDU9RLlRRYSB6f6ekzHVxf7ldxR0EpflXmDLzGYxiEGZcv8hntp4oap4lA/exec";

let scanner = null;
let produit = null;
let verrouScan = false;


// ================================
// SCANNER
// ================================

function demarrerScanner() {

  document.getElementById("resultat").style.display = "none";

  document.getElementById("message").innerText =
    "Autorisez la caméra puis présentez un QR code.";

  if (scanner) {
    try {
      scanner.clear();
    } catch(e) {}
  }

  verrouScan = false;

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      if (verrouScan) return;

      verrouScan = true;

      scanner.stop().then(function() {
        traiterQR(decodedText);
      }).catch(function() {
        traiterQR(decodedText);
      });

    },

    function(errorMessage) {
      // Erreurs normales de lecture ignorées.
    }

  ).catch(function(error) {

    document.getElementById("message").innerHTML =
      "❌ Impossible d'ouvrir la caméra.<br><br>" +
      "Vérifiez l'autorisation de la caméra.";

    console.log(error);
  });
}


// ================================
// LECTURE DU PRODUIT
// ================================

function traiterQR(id) {

  id = String(id).trim();

  produit = {
    id: id,
    stock: null
  };

  document.getElementById("idProduit").innerText =
    "ID : " + id;

  document.getElementById("nomProduit").innerText =
    "Recherche du produit…";

  document.getElementById("stock").innerText =
    "…";

  document.getElementById("stockSaisi").value = "";

  document.getElementById("resultat").style.display =
    "block";

  document.getElementById("message").innerText =
    "QR détecté : " + id;

  recupererProduit(id);
}


// ================================
// RÉCUPÉRATION GOOGLE SHEETS
// ================================

function recupererProduit(id) {

  const callbackName =
    "qrCallback_" + Date.now();

  window[callbackName] = function(data) {

    delete window[callbackName];

    if (script) {
      script.remove();
    }

    if (!data.ok) {

      document.getElementById("nomProduit").innerText =
        "❌ Produit introuvable";

      document.getElementById("stock").innerText =
        "—";

      document.getElementById("message").innerText =
        data.message || "QR inconnu";

      return;
    }

    produit.stock = Number(data.counted || 0);

    document.getElementById("nomProduit").innerText =
      data.name || "Produit";

    document.getElementById("idProduit").innerText =
      "ID : " + data.id;

    document.getElementById("stock").innerText =
      produit.stock;

    document.getElementById("stockSaisi").value =
      produit.stock;

    document.getElementById("message").innerText =
      "✓ Produit trouvé";
  };

  const script = document.createElement("script");

  script.src =
    APPS_SCRIPT +
    "?action=get" +
    "&id=" + encodeURIComponent(id) +
    "&callback=" + encodeURIComponent(callbackName);

  script.onerror = function() {

    delete window[callbackName];

    document.getElementById("nomProduit").innerText =
      "❌ Erreur de connexion";

    document.getElementById("message").innerText =
      "Impossible de contacter Google Sheets.";
  };

  document.body.appendChild(script);
}


// ================================
// SAISIE DIRECTE DU STOCK
// ================================

function enregistrerStock() {

  if (!produit) return;

  const champ =
    document.getElementById("stockSaisi");

  const valeur =
    Number(champ.value);

  if (
    champ.value === "" ||
    !Number.isInteger(valeur) ||
    valeur < 0
  ) {

    document.getElementById("message").innerText =
      "❌ Entrez un nombre entier positif.";

    return;
  }

  document.getElementById("message").innerText =
    "Enregistrement…";

  const url =
    APPS_SCRIPT +
    "?action=set" +
    "&id=" + encodeURIComponent(produit.id) +
    "&quantity=" + encodeURIComponent(valeur);

  const iframe =
    document.createElement("iframe");

  iframe.style.display = "none";
  iframe.src = url;

  document.body.appendChild(iframe);

  produit.stock = valeur;

  document.getElementById("stock").innerText =
    valeur;

  document.getElementById("stockSaisi").value =
    valeur;

  document.getElementById("message").innerText =
    "✓ Stock enregistré";

  setTimeout(function() {
    iframe.remove();
  }, 3000);
}


// ================================
// MODIFIER +1 / -1 / +10 / -10
// ================================

function modifier(delta) {

  if (!produit) return;

  if (produit.stock === null) {
    produit.stock = 0;
  }

  const nouveauStock =
    Math.max(0, produit.stock + delta);

  document.getElementById("message").innerText =
    "Mise à jour…";

  const url =
    APPS_SCRIPT +
    "?action=change" +
    "&id=" + encodeURIComponent(produit.id) +
    "&delta=" + encodeURIComponent(delta);

  const iframe =
    document.createElement("iframe");

  iframe.style.display = "none";
  iframe.src = url;

  document.body.appendChild(iframe);

  produit.stock = nouveauStock;

  document.getElementById("stock").innerText =
    produit.stock;

  document.getElementById("stockSaisi").value =
    produit.stock;

  document.getElementById("message").innerText =
    "✓ Stock mis à jour";

  setTimeout(function() {
    iframe.remove();
  }, 3000);
}

</script>

</body>
</html>
